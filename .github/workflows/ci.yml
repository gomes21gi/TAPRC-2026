name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências de lint
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Verificar sintaxe
        run: python -m py_compile function_app.py

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (formatação)
        run: black --check .

      - name: isort (imports)
        run: isort --check-only .